plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        // NZB-CC: -PlauncherApplicationId=com.gathin.tvhome.preview builds the cinema preview, a separate app that
        // installs beside the launcher: only CinemaActivity and MediaWatch are on, so it never takes Home, the
        // screensaver or the remote's keys, and uninstalling it leaves the launcher exactly as it was.
        def cinema = providers.gradleProperty('launcherApplicationId').getOrElse('').endsWith('.preview')
        manifestPlaceholders = [fullLauncher: cinema ? 'false' : 'true', cinemaPreview: cinema ? 'true' : 'false']
        minSdk 26
        targetSdk 34
        versionCode 1047   // above any upstream build, so it installs over the launcher already on the TV
        versionName '3.5-nzbcc.47'
    }

    // NZB-CC build: one fixed key kept with the source, so every rebuild installs over the last one on the TV.
    signingConfigs {
        nzbcc {
            storeFile rootProject.file('nzbcc-launcher.keystore')
            storePassword 'nzbcc-tv'
            keyAlias 'nzbcc'
            keyPassword 'nzbcc-tv'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.nzbcc
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
